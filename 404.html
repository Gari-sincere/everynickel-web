    <script>

      if (navigator.standalone) {
        const viewport = document.querySelector('meta[name="viewport"]');

    <style id="ios-standalone">
      /* Give WebKit a painted fixed edge before React mounts. The top-edge

         with at least 11px so WebKit can read the box's background color. */
      .ios-top-edge {
        display: none;
      }
      /* iOS 26 (WebKit bug 301108) can size the page to the screen minus
         the status bar. Add the inset back, capped at the large viewport. */
      html.ios-home-screen {
        height: min(100lvh, calc(100% + env(safe-area-inset-top)));
      }
      .ios-home-screen .ios-top-edge {
        display: block;
        position: fixed;
        inset: 0 0 auto;
        z-index: 30;
        height: max(11px, calc(env(safe-area-inset-top) + 6px));
        background-color: #1b8533;
        pointer-events: none;
      }
    </style>
